<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Соня</title>
  <link rel="stylesheet" href="стиль.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222">

  <!-- Иконки -->
  <link rel="icon" sizes="192x192" href="иконка-192.png">
  <link rel="icon" sizes="512x512" href="иконка-512.png">

  <!-- Регистрация сервис-воркера -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
    }
  </script>

  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      justify-content: space-between;
    }
    .top {
      display: flex;
      width: 100%;
      justify-content: space-around;
      padding: 20px;
    }
    .top img {
      max-width: 45%;
      border-radius: 10px;
    }
    .traffic-light {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .light {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin: 5px;
      background-color: gray;
    }
    .light.red { background-color: red; }
    .light.yellow { background-color: yellow; }
    .light.green { background-color: green; }
  </style>
</head>
<body>
  <div class="top">
    <img src="соня.png" alt="Соня">
    <img src="глаз.png" alt="Глаз Сони">
  </div>

  <div class="traffic-light">
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
  </div>
</body>
</html>
