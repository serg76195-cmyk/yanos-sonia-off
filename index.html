<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Независимая Соня</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <div class="portrait">
            <img src="img/sonya.png" alt="Соня">
        </div>
        <div class="eye">
            <img src="img/eye.png" alt="Глаз Сони">
        </div>
    </div>
    <div class="traffic-light">
        <button class="light green" data-color="green"></button>
        <button class="light yellow" data-color="yellow"></button>
        <button class="light red" data-color="red"></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
